# Oyunu GitHub Pages'e yayınlar: main'e her birleştirmede otomatik.
# Adres: https://zerotrust.studymode.fun (alan adı repo ayarlarında: Settings → Pages)
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # yayınlama adımı yüklenen dosyayı listeleyebilsin
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Hazırla ve yükle: dosya bu iş bitince kesinleşir. Yayınlama ayrı işte, bundan sonra.
  # (Tek işte yapınca deploy-pages yeni yüklenen dosyayı bazen bulamıyordu.)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      # Yalnızca oyunun kendisi yayınlanır (araçlar ve belgeler değil)
      - name: Yayın klasörünü hazırla
        run: |
          mkdir -p _site
          cp -r index.html css js CNAME _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
