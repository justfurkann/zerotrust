# Oyunu GitHub Pages'e yayınlar: main'e her birleştirmede otomatik.
# Adres: https://zerotrust.studymode.fun (alan adı repo ayarlarında: Settings → Pages)
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Yalnızca oyunun kendisi yayınlanır (araçlar ve belgeler değil)
      - name: Yayın klasörünü hazırla
        run: |
          mkdir -p _site
          cp -r index.html css js CNAME _site/
          for f in favicon.svg favicon.ico og.png robots.txt; do [ -e "$f" ] && cp "$f" _site/ || true; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
