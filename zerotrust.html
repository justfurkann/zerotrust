<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SİNİR KRİZİ 1080p - Sinir Bozucu Trol Oyunu</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      color: #f9fafb;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }
    #stageWrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      overflow: hidden;
      position: relative;
    }
    #canvasContainer {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: calc((100vh - 110px) * (16 / 9));
      max-height: calc(100vw * (9 / 16));
      aspect-ratio: 16 / 9;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 0 2px rgba(239, 68, 68, 0.35);
      border-radius: 14px;
      overflow: hidden;
      background: #090d16;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .shake {
      animation: shakeAnim 0.28s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shakeAnim {
      10%, 90% { transform: translate3d(-4px, 2px, 0); }
      20%, 80% { transform: translate3d(6px, -3px, 0); }
      30%, 50%, 70% { transform: translate3d(-8px, 4px, 0); }
      40%, 60% { transform: translate3d(8px, -2px, 0); }
    }
  </style>
</head>
<body>

        <button id="lvlBtn2" type="button" class="px-2.5 py-1 text-xs font-bold rounded-md transition text-slate-300 hover:bg-slate-700">Bölüm 3</button>
        <button id="lvlBtn3" type="button" class="px-2.5 py-1 text-xs font-bold rounded-md transition text-slate-300 hover:bg-slate-700">Bölüm 4</button>
        <button id="lvlBtn4" type="button" class="px-2.5 py-1 text-xs font-bold rounded-md transition text-slate-300 hover:bg-slate-700">Bölüm 5</button>

      <button id="muteBtn" type="button" class="px-2.5 py-1.5 text-xs font-bold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 transition">

      </button>

      <button id="fullscreenBtn" type="button" class="px-2.5 py-1.5 text-xs font-bold rounded-lg bg-emerald-600/30 hover:bg-emerald-600/50 text-emerald-200 border border-emerald-500/40 transition">
        ⛶ Tam Ekran

    </div>
  </header>

  <!-- 1920x1080 Oyun Sahnesi -->
  <main id="stageWrapper">

      <!-- Dokunmatik / Fare Kontrolleri -->

          <button id="touchRight" type="button" class="w-12 h-12 rounded-xl bg-slate-900/80 hover:bg-slate-800 active:bg-red-600/80 border border-slate-600 text-white font-black text-lg shadow-lg">▶</button>

        </div>
      </div>

  </main>

  <script>
    (function () {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const container = document.getElementById('canvasContainer');

      const deathCountEl = document.getElementById('deathCountEl');
      const ragePercentEl = document.getElementById('ragePercentEl');
      const xrayBtn = document.getElementById('xrayBtn');
      const restartBtn = document.getElementById('restartBtn');
      const muteBtn = document.getElementById('muteBtn');
      const fullscreenBtn = document.getElementById('fullscreenBtn');

      const W = 1920;
      const H = 1080;

      // Ses Motoru (Web Audio API)
      let audioCtx = null;
      let isMuted = false;

      function ensureAudio() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playSound(type) {
        if (isMuted) return;
        try {
          ensureAudio();
          if (!audioCtx) return;
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);

          if (type === 'jump') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(240, now);
            osc.frequency.exponentialRampToValueAtTime(580, now + 0.14);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
          } else if (type === 'die') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.setValueAtTime(220, now + 0.08);
            osc.frequency.setValueAtTime(130, now + 0.16);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.32);
            osc.start(now);
            osc.stop(now + 0.32);
          } else if (type === 'trap') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(160, now + 0.12);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.13);
            osc.start(now);
            osc.stop(now + 0.13);
          } else if (type === 'win') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(520, now + 0.09);
            osc.frequency.setValueAtTime(680, now + 0.18);
            osc.frequency.setValueAtTime(880, now + 0.28);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
            osc.start(now);
            osc.stop(now + 0.45);
          }
        } catch (e) {}
      }

      // Alaycı Trol Mesajları
      const TROLL_MESSAGES = [

        "Az kalsın geçiyordun... Şaka şaka yaklaşamadın bile.",

        "Mouse'a vurma, onun bir suçu yok!",
        "Bence bu sefer kesin geçersin (Yersen)",
        "Sabır taşı olsan şimdiye çatlamıştın!",
        "Geliştirici şu an ekrana bakıp gülüyor...",
        "Zıplama tuşunun çalıştığından emin misin knk?",
        "Bak sinir katsayın tavan yaptı, bi su iç gel!",
        "O görünmez bloğu oraya kim koydu ya?!"
      ];

      let currentLevelIndex = 0;
      let deaths = 0;
      let rage = 0;
      let xrayMode = false;
      let activeBanner = "BÖLÜM 1: Yeşil kapıya git knk, aşırı kolay (!)";
      let bannerTimer = 240;
      let deathFlashTimer = 0;
      let winBannerTimer = 0;
      let particles = [];

      // Giriş Durumu
      const keys = { left: false, right: false, jump: false };

      // Oyuncu
      const player = {
        x: 120,
        y: 700,
        w: 48,
        h: 48,
        vx: 0,
        vy: 0,
        onGround: false,
        gravityDir: 1,
        controlsInverted: false,
        dead: false,
        face: "😐"
      };

      // Bölüm 6 (Index 5): "Kaçan Buton & Trol Onay" mini oyun durumu

        btnX: 820,
        btnY: 500,
        btnW: 280,
        btnH: 90,
        clicks: 0,
        targetClicks: 5,
        dodges: 0,
        fakeButtons: [],

      // Bölüm Tasarımları (1920x1080 koordinat sisteminde)

        if (idx === 0) {
          // Bölüm 1: Masum Başlangıç
          return {
            title: "BÖLÜM 1: Masum Başlangıç (Yersen)",
            hint: "Düşen köprüye, görünmez tavana ve kaçan kapıya dikkat!",

              // İkinci platformda gizli diken

            signs: [
              { x: 180, y: 810, text: "Dümdüz yürü knk tuzak yok valla ->" },

            ],
            signs: [
              { x: 180, y: 810, text: "MOR BÖLGEDE TUŞLAR TERS ÇALIŞIR!" },
              { x: 1140, y: 675, text: "Sol = Sağ, Sağ = Sol! Beynin yandı mı?" }
            ],
            goal: {
              x: 1770, y: 540, w: 74, h: 110,
              trollMovesLeft: 1,
              trollTargetX: 1650,
              trollText: "Kapı arkana geçti knk!"
            },
            fakeGoals: [],
            reverseZone: { x: 1090, w: 530 },
            gravityLineX: null,
            ceilingSpikes: []
          };
        } else if (idx === 2) {
          // Bölüm 3: Kayan Dikenler & Sahte Altın Kapı
          return {
            title: "BÖLÜM 3: Sahte Kapı & Kayan Diken Pususu",
            hint: "Parlak altın kapıya kanma! Gerçek çıkış üst katta.",
            spawn: { x: 90, y: 800 },
            platforms: [
              { x: 0, y: 890, w: 620, h: 190, type: 'solid' },
              { x: 740, y: 820, w: 520, h: 260, type: 'solid' },
              { x: 1380, y: 820, w: 540, h: 260, type: 'solid' },
              // Üst kat gerçek kapı yolu
              { x: 1120, y: 620, w: 220, h: 36, type: 'solid' },
              { x: 760, y: 470, w: 300, h: 36, type: 'solid' },
              { x: 320, y: 380, w: 350, h: 36, type: 'solid' },
              // Görünmez basamak (yardımcı ama trol)
              { x: 1380, y: 610, w: 90, h: 40, type: 'invisible', revealed: false }
            ],
            spikes: [
              // Kayan diken 1
              { x: 480, y: 858, w: 70, h: 32, hidden: false, revealed: true, slideToX: 290, triggered: false, triggerX: 230 },
              // Kayan diken 2
              { x: 1120, y: 788, w: 75, h: 32, hidden: false, revealed: true, slideToX: 880, triggered: false, triggerX: 800 },
              { x: 620, y: 1045, w: 120, h: 35, hidden: false, revealed: true },
              { x: 1260, y: 1045, w: 120, h: 35, hidden: false, revealed: true }
            ],
            signs: [
              { x: 1450, y: 755, text: "ALTIN KAPI = %100 GÜVENLİ ÖDÜL (!)" },

            ],
            goal: {
              x: 370, y: 270, w: 74, h: 110,
              trollMovesLeft: 0,
              trollTargetX: 370,
              trollText: ""
            },
            fakeGoals: [
              { x: 1750, y: 710, w: 74, h: 110, label: "БЕЛЕШ GEÇİŞ" }
            ],
            reverseZone: null,
            gravityLineX: null,
            ceilingSpikes: []
          };
        } else if (idx === 3) {

          return {
            title: "BÖLÜM 4: Yerçekimi İhaneti & Düşen Avizeler",
            hint: "Mavi lazeri geçince yerçekimi tersine döner, tavanda yürü!",
            spawn: { x: 100, y: 790 },
            platforms: [
              { x: 0, y: 880, w: 860, h: 200, type: 'solid' },

              { x: 1420, y: 820, w: 500, h: 260, type: 'solid' }
            ],
            spikes: [

              { x: 1120, y: 170, w: 80, h: 32, hidden: true, revealed: false, triggerX: 1030, triggerDist: 100, inverted: true },

            ],
            signs: [
              { x: 200, y: 810, text: "Mavi çizgiye basınca TAVANA uçacaksın!" },
              { x: 920, y: 220, text: "Tavanda yürümek de ayrı sinir bozucu dimi?" }
            ],
            goal: {
              x: 1760, y: 710, w: 74, h: 110,
              trollMovesLeft: 1,

              trollText: "Kapı: 'Beni yakalayamazsın knk!'"
            },
            fakeGoals: [],
            reverseZone: null,
            gravityLineX: 810,
            gravityRestoreX: 1460,
            ceilingSpikes: [
              { x: 600, y: 80, w: 60, h: 70, vy: 0, triggered: false, triggerX: 540 }
            ]
          };
        } else {
          // Bölüm 5: Sabır Taşı Finali
          return {
            title: "BÖLÜM 5: Sabır Taşı Finali (Kombine Trol)",
            hint: "Düşen taşlar, ters kontrol, kayan diken ve kaçan final kapısı!",
            spawn: { x: 90, y: 790 },
            platforms: [
              { x: 0, y: 880, w: 380, h: 200, type: 'solid' },
              { x: 450, y: 820, w: 180, h: 40, type: 'falling', triggered: false, delay: 4, vy: 0, origY: 820 },
              { x: 700, y: 760, w: 420, h: 320, type: 'solid' },
              { x: 1200, y: 690, w: 200, h: 40, type: 'falling', triggered: false, delay: 4, vy: 0, origY: 690 },
              { x: 1470, y: 640, w: 450, h: 440, type: 'solid' },
              { x: 380, y: 620, w: 80, h: 40, type: 'invisible', revealed: false }
            ],
            spikes: [
              { x: 980, y: 728, w: 75, h: 32, hidden: false, revealed: true, slideToX: 770, triggered: false, triggerX: 730 },
              { x: 1620, y: 608, w: 70, h: 32, hidden: true, revealed: false, triggerX: 1530, triggerDist: 95 },
              { x: 380, y: 1045, w: 1090, h: 35, hidden: false, revealed: true }
            ],
            signs: [
              { x: 120, y: 810, text: "Son bölüm knk, bunu geçen bordo berelidir!" },
              { x: 1520, y: 575, text: "Kapıya dokununca hemen sevinme :)" }
            ],
            goal: {
              x: 1800, y: 530, w: 74, h: 110,
              trollMovesLeft: 2,
              trollTargetX: 1500,
              trollText: "ŞAKA ŞAKA! Bir kere daha yakala!"
            },
            fakeGoals: [],
            reverseZone: { x: 700, w: 420 },
            gravityLineX: null,
            ceilingSpikes: []
          };
        }
      }

      let level = buildLevel(0);

      function updateLevelButtons() {
        for (let i = 0; i < 6; i++) {
          const btn = document.getElementById('lvlBtn' + i);
          if (!btn) continue;
          if (i === currentLevelIndex) {
            btn.className = "px-2.5 py-1 text-xs font-bold rounded-md transition bg-red-600 text-white shadow";
          } else if (i === 5) {
            btn.className = "px-2.5 py-1 text-xs font-bold rounded-md transition text-amber-300 hover:bg-slate-700";
          } else {
            btn.className = "px-2.5 py-1 text-xs font-bold rounded-md transition text-slate-300 hover:bg-slate-700";
          }
        }
      }

      function initButtonGame() {
        buttonGame.btnX = 820;
        buttonGame.btnY = 490;
        buttonGame.clicks = 0;
        buttonGame.dodges = 0;
        buttonGame.fakeButtons = [];
        buttonGame.message = "Ödülü almak için KIRMIZI BUTONA 5 kez tıkla knk! (Yakalayabilirsen)";
      }

      function loadLevel(idx, keepBanner) {
        currentLevelIndex = idx;
        updateLevelButtons();
        if (idx === 5) {
          initButtonGame();
          activeBanner = "BONUS MOD: Kaçan Butonu 5 kere yakala!";
          bannerTimer = 220;
          return;
        }
        level = buildLevel(idx);
        player.x = level.spawn.x;
        player.y = level.spawn.y;
        player.vx = 0;
        player.vy = 0;
        player.onGround = false;
        player.gravityDir = 1;
        player.controlsInverted = false;
        player.dead = false;
        player.face = "😐";
        if (!keepBanner) {
          activeBanner = level.title + " — " + level.hint;
          bannerTimer = 220;
        }
      }

      function spawnParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
          particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 14,
            vy: (Math.random() - 0.5) * 14,
            size: 5 + Math.random() * 7,
            color: color,
            life: 28 + Math.random() * 18
          });
        }
      }

      function killPlayer(customReason) {
        if (player.dead) return;
        player.dead = true;
        deaths++;
        rage = Math.min(999, rage + Math.floor(12 + Math.random() * 17));
        deathCountEl.textContent = String(deaths);
        ragePercentEl.textContent = "%" + rage;
        deathFlashTimer = 18;
        playSound('die');
        spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ef4444', 26);

        container.classList.remove('shake');
        void container.offsetWidth;
        container.classList.add('shake');

        const msg = customReason || TROLL_MESSAGES[deaths % TROLL_MESSAGES.length];
        activeBanner = "💀 ÖLDÜN KNK: " + msg;
        bannerTimer = 210;

        setTimeout(() => {
          loadLevel(currentLevelIndex, true);
        }, 420);
      }

      function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
        return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
      }

      function updatePlatformer() {
        if (player.dead) return;

        // Ters kontrol bölgesi kontrolü
        if (level.reverseZone) {
          const rz = level.reverseZone;
          const inReverse = (player.x + player.w / 2 >= rz.x && player.x + player.w / 2 <= rz.x + rz.w);
          if (inReverse && !player.controlsInverted) {
            player.controlsInverted = true;
            activeBanner = "🌀 TERS KONTROL BÖLGESİ! Sol ve Sağ yer değiştirdi!";
            bannerTimer = 140;
            playSound('trap');
          } else if (!inReverse && player.controlsInverted) {
            player.controlsInverted = false;
          }
        } else {
          player.controlsInverted = false;
        }

        // Yerçekimi çizgisi kontrolü (Bölüm 4)
        if (level.gravityLineX) {
          if (player.x > level.gravityLineX && player.x < (level.gravityRestoreX || 9999) && player.gravityDir === 1) {
            player.gravityDir = -1;
            player.vy = -6;
            activeBanner = "🙃 YERÇEKİMİ TERS DÖNDÜ! Tavana dikkat!";
            bannerTimer = 150;
            playSound('trap');
          } else if (level.gravityRestoreX && player.x >= level.gravityRestoreX && player.gravityDir === -1) {
            player.gravityDir = 1;
            player.vy = 6;
            activeBanner = "⬇️ Yerçekimi normale döndü!";
            bannerTimer = 120;
            playSound('trap');
          }
        }

        // Yatay hareket
        let moveLeft = keys.left;
        let moveRight = keys.right;
        if (player.controlsInverted) {
          const tmp = moveLeft;
          moveLeft = moveRight;
          moveRight = tmp;
        }

        const speed = 7.8;
        if (moveLeft) {
          player.vx = -speed;
          player.face = player.controlsInverted ? "😵" : "😠";
        } else if (moveRight) {
          player.vx = speed;
          player.face = player.controlsInverted ? "😵" : "😤";
        } else {
          player.vx *= 0.72;
          if (Math.abs(player.vx) < 0.2) player.vx = 0;
          player.face = rage > 100 ? "🤬" : "😐";
        }

        // Zıplama
        const jumpJustPressed = keys.jump && !jumpPressedLastFrame;
        jumpPressedLastFrame = keys.jump;

        if (jumpJustPressed && player.onGround) {
          player.vy = -17.2 * player.gravityDir;
          player.onGround = false;
          playSound('jump');
          spawnParticles(player.x + player.w / 2, player.gravityDir === 1 ? player.y + player.h : player.y, '#fbbf24', 8);
        }

        // Yerçekimi
        player.vy += 0.82 * player.gravityDir;
        if (player.vy > 22) player.vy = 22;
        if (player.vy < -22) player.vy = -22;

        // X Ekseninde Hareket & Çarpışma
        player.x += player.vx;
        if (player.x < 0) player.x = 0;
        if (player.x + player.w > W) player.x = W - player.w;

        for (const p of level.platforms) {
          if (p.type === 'invisible' && !p.revealed) continue;
          if (rectOverlap(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
            if (player.vx > 0) player.x = p.x - player.w;
            else if (player.vx < 0) player.x = p.x + p.w;
          }
        }

        // Y Ekseninde Hareket & Çarpışma
        const prevY = player.y;
        player.y += player.vy;
        player.onGround = false;

        for (const p of level.platforms) {
          if (p.type === 'invisible' && !p.revealed) {
            // Sadece alttan yukarı zıplarken kafayı çarpınca görünür olsun
            if (player.vy < 0 && prevY >= p.y + p.h - 6 &&
                rectOverlap(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
              p.revealed = true;
              player.y = p.y + p.h;
              player.vy = 4;
              playSound('trap');
              activeBanner = "🧱 SÜRPRİZ GÖRÜNMEZ BLOK! Kafan acıdı mı knk?";
              bannerTimer = 150;
              spawnParticles(p.x + p.w / 2, p.y + p.h, '#f59e0b', 14);
            }
            continue;
          }

          if (rectOverlap(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
            if (player.gravityDir === 1) {
              if (player.vy > 0 && prevY + player.h <= p.y + 24) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
                if (p.type === 'falling' && !p.triggered) {
                  p.triggered = true;
                  playSound('trap');
                  activeBanner = "⚠️ KÖPRÜ ÇÖKÜYOR KNK KOŞ!";
                  bannerTimer = 110;
                }
              } else if (player.vy < 0 && prevY >= p.y + p.h - 24) {
                player.y = p.y + p.h;
                player.vy = 2;
              }
            } else {
              // Ters yerçekimi (tavanda yürüme)
              if (player.vy < 0 && prevY >= p.y + p.h - 24) {
                player.y = p.y + p.h;
                player.vy = 0;
                player.onGround = true;
              } else if (player.vy > 0 && prevY + player.h <= p.y + 24) {
                player.y = p.y - player.h;
                player.vy = -2;
              }
            }
          }
        }

        // Düşen platformları güncelle
        for (const p of level.platforms) {
          if (p.type === 'falling' && p.triggered) {
            if (p.delay > 0) {
              p.delay--;
            } else {
              p.vy += 0.95;
              p.y += p.vy;
            }
          }
        }

        // Tavan sarkıt dikenlerini güncelle
        if (level.ceilingSpikes) {
          for (const cs of level.ceilingSpikes) {
            if (!cs.triggered && Math.abs((player.x + player.w / 2) - cs.triggerX) < 85) {
              cs.triggered = true;
              playSound('trap');
              activeBanner = "🗡️ TAVANDAN DİKEN DÜŞÜYOR!";
              bannerTimer = 110;
            }
            if (cs.triggered) {
              cs.vy += 1.1;
              cs.y += cs.vy;
            }
            if (rectOverlap(player.x + 6, player.y + 6, player.w - 12, player.h - 12, cs.x, cs.y, cs.w, cs.h)) {
              killPlayer("Kafana avize gibi diken düştü knk!");
              return;
            }
          }
        }

        // Diken tetiklemeleri ve çarpışmaları
        for (const s of level.spikes) {
          if (s.hidden && !s.revealed) {
            const dist = Math.abs((player.x + player.w / 2) - s.triggerX);
            if (dist < (s.triggerDist || 95)) {
              s.revealed = true;
              playSound('trap');
              spawnParticles(s.x + s.w / 2, s.y, '#ef4444', 10);
            }
          }
          if (s.slideToX !== undefined && !s.triggered) {
            if (player.x + player.w > s.triggerX) {
              s.triggered = true;
              playSound('trap');
              activeBanner = "⛸️ DİKEN SANA DOĞRU KAYIYOR!";
              bannerTimer = 120;
            }
          }
          if (s.triggered && s.slideToX !== undefined) {
            s.x += (s.slideToX - s.x) * 0.22;
          }

          if (!s.hidden || s.revealed) {
            if (rectOverlap(player.x + 8, player.y + 8, player.w - 16, player.h - 14, s.x, s.y, s.w, s.h)) {
              killPlayer(s.hidden ? "Gizli dikene afiyetle oturdun knk!" : "Dikene kafa attın tebrikler!");
              return;
            }
          }
        }

        // Sahte Kapılar
        for (const fg of level.fakeGoals) {
          if (rectOverlap(player.x, player.y, player.w, player.h, fg.x, fg.y, fg.w, fg.h)) {
            killPlayer("SAHTE ALTIN KAPIYA KANDIN HAHAHA! Bedava peynir fare kapanında olur!");
            return;
          }
        }

        // Gerçek Kapı & Kaçan Kapı Trolü
        const g = level.goal;
        const distToGoal = Math.hypot((player.x + player.w / 2) - (g.x + g.w / 2), (player.y + player.h / 2) - (g.y + g.h / 2));
        if (g.trollMovesLeft > 0 && distToGoal < 95) {
          g.trollMovesLeft--;
          playSound('trap');
          spawnParticles(g.x + g.w / 2, g.y + g.h / 2, '#10b981', 18);
          if (g.trollMovesLeft === 1 && currentLevelIndex === 4) {
            g.x = 1520;
          } else {
            g.x = g.trollTargetX;
          }
          activeBanner = "🏃 " + g.trollText;
          bannerTimer = 160;
        }

        if (rectOverlap(player.x, player.y, player.w, player.h, g.x, g.y, g.w, g.h)) {
          playSound('win');
          spawnParticles(g.x + g.w / 2, g.y + g.h / 2, '#34d399', 35);
          winBannerTimer = 65;
          if (currentLevelIndex < 4) {
            const nextLvl = currentLevelIndex + 1;
            activeBanner = "🎉 HELAL KNK! Bölüm " + (currentLevelIndex + 1) + " bitti, sıradaki daha beter!";
            bannerTimer = 220;
            loadLevel(nextLvl, true);
          } else {
            activeBanner = "👑 EFSANESİN! 5 Trol Bölümünü de bitirdin! Şimdi Kaçan Buton modunu dene!";
            bannerTimer = 300;
            loadLevel(5, true);
          }
          return;
        }

        // Ekran dışına düşme kontrolü
        if (player.y > H + 60 || player.y < -120) {
          killPlayer("Boşluğa uçtun knk, kanatların yok unutma!");
        }
      }

      // Çizim Fonksiyonları
      function drawSpikes(x, y, w, h, inverted, isHiddenGhost) {
        const count = Math.max(2, Math.floor(w / 24));
        const step = w / count;
        ctx.save();
        if (isHiddenGhost) {
          ctx.globalAlpha = 0.45;
          ctx.fillStyle = '#818cf8';
        } else {
          ctx.fillStyle = '#ef4444';
        }
        ctx.beginPath();
        for (let i = 0; i < count; i++) {
          const sx = x + i * step;
          if (!inverted) {
            ctx.moveTo(sx, y + h);
            ctx.lineTo(sx + step / 2, y);
            ctx.lineTo(sx + step, y + h);
          } else {
            ctx.moveTo(sx, y);
            ctx.lineTo(sx + step / 2, y + h);
            ctx.lineTo(sx + step, y);
          }
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawDoor(x, y, w, h, isFake) {
        ctx.save();
        ctx.fillStyle = isFake ? '#f59e0b' : '#10b981';
        ctx.strokeStyle = isFake ? '#fde68a' : '#a7f3d0';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, [36, 36, 4, 4]);
        ctx.fill();
        ctx.stroke();

        // Kapı kolu
        ctx.fillStyle = '#064e3b';
        ctx.beginPath();
        ctx.arc(x + w - 16, y + h / 2, 6, 0, Math.PI * 2);
        ctx.fill();

        // Üst Etiket
        ctx.font = '800 18px Inter';
        ctx.fillStyle = isFake ? '#fbbf24' : '#34d399';
        ctx.textAlign = 'center';
        ctx.fillText(isFake ? (xrayMode ? "⚠️ SAHTE KAPI" : "★ ÖDÜLLÜ ÇIKIŞ ★") : "ÇIKIŞ", x + w / 2, y - 12);
        ctx.restore();
      }

      function renderPlatformer() {
        // Arka plan 1920x1080 ızgarası
        ctx.fillStyle = '#0b1120';
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = 'rgba(148, 163, 184, 0.06)';
        ctx.lineWidth = 2;
        for (let gx = 0; gx <= W; gx += 80) {
          ctx.beginPath();
          ctx.moveTo(gx, 0);
          ctx.lineTo(gx, H);
          ctx.stroke();
        }
        for (let gy = 0; gy <= H; gy += 80) {
          ctx.beginPath();
          ctx.moveTo(0, gy);
          ctx.lineTo(W, gy);
          ctx.stroke();
        }

        // Ters Kontrol Bölgesi Çizimi
        if (level.reverseZone) {
          const rz = level.reverseZone;
          ctx.save();
          ctx.fillStyle = 'rgba(168, 85, 247, 0.12)';
          ctx.fillRect(rz.x, 0, rz.w, H);
          ctx.strokeStyle = 'rgba(192, 132, 252, 0.45)';
          ctx.setLineDash([12, 10]);
          ctx.strokeRect(rz.x, 0, rz.w, H);
          ctx.font = '900 24px Inter';
          ctx.fillStyle = 'rgba(216, 180, 254, 0.55)';
          ctx.textAlign = 'center';
          ctx.fillText("⇄ TERS KONTROL ALANI ⇄", rz.x + rz.w / 2, 130);
          ctx.restore();
        }

        // Yerçekimi Çizgisi (Bölüm 4)
        if (level.gravityLineX) {
          ctx.save();
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 5;
          ctx.setLineDash([16, 12]);
          ctx.beginPath();
          ctx.moveTo(level.gravityLineX, 0);
          ctx.lineTo(level.gravityLineX, H);
          ctx.stroke();
          ctx.font = '800 20px Inter';
          ctx.fillStyle = '#38bdf8';
          ctx.fillText("⚡ YERÇEKİMİ LAZERİ", level.gravityLineX - 95, 60);

          if (level.gravityRestoreX) {
            ctx.strokeStyle = '#f59e0b';
            ctx.beginPath();
            ctx.moveTo(level.gravityRestoreX, 0);
            ctx.lineTo(level.gravityRestoreX, H);
            ctx.stroke();
            ctx.fillStyle = '#f59e0b';
            ctx.fillText("⬇️ NORMAL YERÇEKİMİ", level.gravityRestoreX - 95, 60);
          }
          ctx.restore();
        }

        // Tabelalar
        for (const sign of level.signs) {
          ctx.save();
          ctx.fillStyle = '#1e293b';
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 3;
          const tw = ctx.measureText(sign.text).width + 44;
          ctx.beginPath();
          ctx.roundRect(sign.x, sign.y - 46, Math.max(260, tw), 44, 10);
          ctx.fill();
          ctx.stroke();
          ctx.font = '700 18px Inter';
          ctx.fillStyle = '#e2e8f0';
          ctx.fillText("🪧 " + sign.text, sign.x + 14, sign.y - 18);
          ctx.restore();
        }

        // Platformlar
        for (const p of level.platforms) {
          if (p.type === 'invisible' && !p.revealed && !xrayMode) continue;
          ctx.save();
          if (p.type === 'solid') {
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#38bdf8';
          } else if (p.type === 'falling') {
            ctx.fillStyle = p.triggered ? '#7f1d1d' : (xrayMode ? '#78350f' : '#1e293b');
            ctx.strokeStyle = p.triggered ? '#ef4444' : (xrayMode ? '#f59e0b' : '#38bdf8');
          } else if (p.type === 'invisible') {
            ctx.globalAlpha = p.revealed ? 1 : 0.45;
            ctx.fillStyle = '#b45309';
            ctx.strokeStyle = '#fbbf24';
          }
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(p.x, p.y, p.w, p.h, 8);
          ctx.fill();
          ctx.stroke();

          if (xrayMode && p.type === 'falling' && !p.triggered) {
            ctx.fillStyle = '#fde68a';
            ctx.font = '700 16px Inter';
            ctx.fillText("⚠️ DÜŞEN KÖPRÜ", p.x + 16, p.y + 28);
          }
          if (p.type === 'invisible' && (p.revealed || xrayMode)) {
            ctx.fillStyle = '#fef3c7';
            ctx.font = '800 16px Inter';
            ctx.fillText("TROL BLOK", p.x + 6, p.y + 26);
          }
          ctx.restore();
        }

        // Dikenler
        for (const s of level.spikes) {
          if (s.hidden && !s.revealed) {
            if (xrayMode) {
              drawSpikes(s.x, s.y, s.w, s.h, s.inverted, true);
            }
          } else {
            drawSpikes(s.x, s.y, s.w, s.h, s.inverted, false);
          }
        }

        // Tavan Sarkıtları
        if (level.ceilingSpikes) {
          for (const cs of level.ceilingSpikes) {
            drawSpikes(cs.x, cs.y, cs.w, cs.h, true, false);
          }
        }

        // Sahte ve Gerçek Kapılar
        for (const fg of level.fakeGoals) {
          drawDoor(fg.x, fg.y, fg.w, fg.h, true);
        }
        drawDoor(level.goal.x, level.goal.y, level.goal.w, level.goal.h, false);

        // Oyuncu Çizimi
        if (!player.dead) {
          ctx.save();
          ctx.fillStyle = player.controlsInverted ? '#a855f7' : '#ef4444';
          ctx.strokeStyle = '#fecaca';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(player.x, player.y, player.w, player.h, 12);
          ctx.fill();
          ctx.stroke();

          ctx.font = '30px Inter';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(player.face, player.x + player.w / 2, player.y + player.h / 2 + 2);
          ctx.restore();
        }
      }

      // Bonus Mod: Kaçan Buton & Trol Arena Çizimi
      function renderButtonGame() {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, W, H);

        // Başlık
        ctx.save();
        ctx.font = '900 42px Inter';
        ctx.fillStyle = '#f8fafc';
        ctx.textAlign = 'center';
        ctx.fillText("🎯 BONUS MOD: KAÇAN BUTONU YAKALA (1920×1080)", W / 2, 130);

        ctx.font = '600 24px Inter';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(buttonGame.message, W / 2, 185);

        ctx.font = '800 26px Inter';
        ctx.fillStyle = '#fbbf24';
        ctx.fillText(`Yakalanan: ${buttonGame.clicks} / ${buttonGame.targetClicks}   |   Kaçış Sayısı: ${buttonGame.dodges}`, W / 2, 235);

        // Sahte Butonlar
        for (const fb of buttonGame.fakeButtons) {
          ctx.fillStyle = '#334155';
          ctx.strokeStyle = '#64748b';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(fb.x, fb.y, fb.w, fb.h, 16);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#cbd5e1';
          ctx.font = '800 20px Inter';
          ctx.fillText(fb.label, fb.x + fb.w / 2, fb.y + fb.h / 2 + 7);
        }

        // Gerçek Kaçan Kırmızı Buton
        ctx.fillStyle = '#dc2626';
        ctx.strokeStyle = '#fca5a5';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.roundRect(buttonGame.btnX, buttonGame.btnY, buttonGame.btnW, buttonGame.btnH, 20);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 24px Inter';
        ctx.fillText("🎁 ÖDÜLÜ AL (TIKLA)", buttonGame.btnX + buttonGame.btnW / 2, buttonGame.btnY + buttonGame.btnH / 2 + 8);
        ctx.restore();
      }

      // Üst HUD / Trol Bildirim Çubuğu (1920x1080 Canvas içi)
      function renderHUD() {
        // Parçacıklar
        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.x += pt.vx;
          pt.y += pt.vy;
          pt.life--;
          ctx.fillStyle = pt.color;
          ctx.globalAlpha = Math.max(0, pt.life / 35);
          ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
          ctx.globalAlpha = 1;
          if (pt.life <= 0) particles.splice(i, 1);
        }

        // Ölüm kırmızı flaşı
        if (deathFlashTimer > 0) {
          ctx.fillStyle = `rgba(239, 68, 68, ${deathFlashTimer * 0.02})`;
          ctx.fillRect(0, 0, W, H);
          deathFlashTimer--;
        }

        // Üst Trol Banner
        if (bannerTimer > 0) {
          bannerTimer--;
          ctx.save();
          ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(W / 2 - 540, 22, 1080, 62, 16);
          ctx.fill();
          ctx.stroke();

          ctx.font = '800 24px Inter';
          ctx.fillStyle = '#fef2f2';
          ctx.textAlign = 'center';
          ctx.fillText(activeBanner, W / 2, 61);
          ctx.restore();
        }

        // Sağ üst 1920x1080 Çözünürlük Rozeti
        ctx.save();
        ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(W - 255, 22, 230, 44, 10);
        ctx.fill();
        ctx.stroke();
        ctx.font = '700 16px Inter';
        ctx.fillStyle = '#94a3b8';
        ctx.textAlign = 'center';
        ctx.fillText("1920×1080 HD SAHNE", W - 140, 49);
        ctx.restore();
      }

      // Ana Oyun Döngüsü
      let animId = null;
      function loop() {
        if (currentLevelIndex === 5) {
          renderButtonGame();
        } else {
          updatePlatformer();
          renderPlatformer();
        }
        renderHUD();
        animId = requestAnimationFrame(loop);
      }

      // Kaçan Buton Fare Etkileşimi (1920x1080 ölçekli koordinat)
      function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (W / rect.width),
          y: (clientY - rect.top) * (H / rect.height)
        };
      }

      canvas.addEventListener('mousemove', function (e) {
        if (currentLevelIndex !== 5) return;
        const pos = getCanvasCoords(e);
        const cx = buttonGame.btnX + buttonGame.btnW / 2;
        const cy = buttonGame.btnY + buttonGame.btnH / 2;
        const dist = Math.hypot(pos.x - cx, pos.y - cy);

        // Tuzak Radarı kapalıysa buton fareden kaçar (ama her 5 kaçışta bir yakalanabilir şans verir)
        if (!xrayMode && dist < 175 && (buttonGame.dodges % 5 !== 4)) {
          buttonGame.dodges++;
          playSound('trap');
          buttonGame.btnX = 180 + Math.random() * (W - 640);
          buttonGame.btnY = 280 + Math.random() * (H - 460);
          rage = Math.min(999, rage + 5);
          ragePercentEl.textContent = "%" + rage;

          const taunts = [
            "Az daha hızlı ol knk mouse yaşlandı mı? 😂",
            "Yakalayamazsın ki! (İpucu: 5. denemede yoruluyor)",
            "Hop buradayım knk!",
            "Sahte butonlara basma sakın!"
          ];
          buttonGame.message = taunts[buttonGame.dodges % taunts.length];

          if (buttonGame.fakeButtons.length < 6) {
            buttonGame.fakeButtons.push({
              x: 160 + Math.random() * (W - 560),
              y: 280 + Math.random() * (H - 440),
              w: 240,
              h: 76,
              label: "SAHTE BUTON #" + (buttonGame.fakeButtons.length + 1)
            });
          }
        }
      });

      canvas.addEventListener('mousedown', function (e) {
        ensureAudio();
        if (currentLevelIndex !== 5) return;
        const pos = getCanvasCoords(e);

        // Gerçek butona tıklandı mı?
        if (pos.x >= buttonGame.btnX && pos.x <= buttonGame.btnX + buttonGame.btnW &&
            pos.y >= buttonGame.btnY && pos.y <= buttonGame.btnY + buttonGame.btnH) {
          buttonGame.clicks++;
          buttonGame.dodges++;
          playSound('win');
          spawnParticles(pos.x, pos.y, '#22c55e', 28);
          buttonGame.btnX = 200 + Math.random() * (W - 680);
          buttonGame.btnY = 280 + Math.random() * (H - 460);

          if (buttonGame.clicks >= buttonGame.targetClicks) {
            buttonGame.message = "🏆 TEBRİKLER KNK! İmkansız butonu 5 kez yakaladın, sabır testi tamamlandı!";
            activeBanner = "🏆 OYUNU TAMAMEN FETHETTİN KNK! Sinir sistemin çeliktenmiş!";
            bannerTimer = 320;
            buttonGame.clicks = 0;
            buttonGame.fakeButtons = [];
          } else {
            buttonGame.message = `Helal! ${buttonGame.clicks}/${buttonGame.targetClicks} kez yakaladın, devam!`;
          }
          return;
        }

        // Sahte butona tıklandı mı?
        for (const fb of buttonGame.fakeButtons) {
          if (pos.x >= fb.x && pos.x <= fb.x + fb.w && pos.y >= fb.y && pos.y <= fb.y + fb.h) {
            deaths++;
            rage = Math.min(999, rage + 15);
            deathCountEl.textContent = String(deaths);
            ragePercentEl.textContent = "%" + rage;
            playSound('die');
            spawnParticles(pos.x, pos.y, '#ef4444', 20);
            buttonGame.message = "💀 SAHTE BUTONA TIKLADIN! Sayaç sıfırlandı knk hahaha!";
            buttonGame.clicks = 0;
            return;
          }
        }
      });

      // Klavye Kontrolleri
      window.addEventListener('keydown', function (e) {
        ensureAudio();
        const code = e.code;
        if (code === 'ArrowLeft' || code === 'KeyA') keys.left = true;
        if (code === 'ArrowRight' || code === 'KeyD') keys.right = true;
        if (code === 'ArrowUp' || code === 'KeyW' || code === 'Space') {
          keys.jump = true;
          e.preventDefault();
        }
        if (code === 'KeyR') {
          loadLevel(currentLevelIndex, false);
        }
      });

      window.addEventListener('keyup', function (e) {
        const code = e.code;
        if (code === 'ArrowLeft' || code === 'KeyA') keys.left = false;
        if (code === 'ArrowRight' || code === 'KeyD') keys.right = false;
        if (code === 'ArrowUp' || code === 'KeyW' || code === 'Space') keys.jump = false;
      });

      // Üst Bar Butonları
      for (let i = 0; i < 6; i++) {
        const btn = document.getElementById('lvlBtn' + i);
        if (btn) {
          btn.addEventListener('click', function () {
            ensureAudio();
            loadLevel(i, false);
          });
        }
      }

      xrayBtn.addEventListener('click', function () {
        ensureAudio();
        xrayMode = !xrayMode;
        xrayBtn.textContent = xrayMode ? "👁️ Tuzak Radarı: Açık" : "👁️ Tuzak Radarı: Kapalı";
        xrayBtn.className = xrayMode
          ? "px-2.5 py-1.5 text-xs font-bold rounded-lg bg-amber-500 text-slate-950 border border-amber-300 transition"
          : "px-2.5 py-1.5 text-xs font-bold rounded-lg bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-200 border border-indigo-500/40 transition";
        activeBanner = xrayMode
          ? "👁️ Tuzak Radarı Açıldı: Gizli dikenler ve görünmez bloklar artık görünüyor!"
          : "👁️ Tuzak Radarı Kapatıldı: Gerçek sinir krizi moduna dönüldü!";
        bannerTimer = 160;
      });

      restartBtn.addEventListener('click', function () {
        ensureAudio();
        loadLevel(currentLevelIndex, false);
      });

      muteBtn.addEventListener('click', function () {
        isMuted = !isMuted;
        muteBtn.textContent = isMuted ? "🔇 Ses: Kapalı" : "🔊 Ses: Açık";
      });

      fullscreenBtn.addEventListener('click', function () {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(function () {});
        } else {
          document.exitFullscreen().catch(function () {});
        }
      });

      // Dokunmatik / Fare Kontrolleri
      function bindHoldButton(btnId, keyName) {
        const el = document.getElementById(btnId);
        if (!el) return;
        const start = function (e) { e.preventDefault(); ensureAudio(); keys[keyName] = true; };
        const end = function (e) { e.preventDefault(); keys[keyName] = false; };
        el.addEventListener('mousedown', start);
        el.addEventListener('mouseup', end);
        el.addEventListener('mouseleave', end);
        el.addEventListener('touchstart', start, { passive: false });
        el.addEventListener('touchend', end, { passive: false });
      }

      bindHoldButton('touchLeft', 'left');
      bindHoldButton('touchRight', 'right');
      bindHoldButton('touchJump', 'jump');

      window.onload = function () {
        loadLevel(0, false);
        if (animId) cancelAnimationFrame(animId);
        loop();
      };
    })();
  </script>
</body>
</html>
