# Netlify artık oyunu yayınlamıyor: oyun https://zerotrust.studymode.fun adresinde (GitHub Pages).
# Eski adrese gelen herkes netlify-move/ sayfasına düşer; o sayfa tarayıcıdaki kaydı alıp
# yeni adrese taşır. Netlify yalnızca bu taşıma sayfası değişirse yeniden yayın yapar.
[build]
  publish = "netlify-move"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify-move netlify.toml"
