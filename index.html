<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zero Trust</title>
  <meta name="description" content="Zero Trust — a troll platformer. Trust nothing." />
  <meta name="theme-color" content="#060607" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23060607'/%3E%3Crect x='7' y='7' width='18' height='18' fill='%23c8ff3d'/%3E%3Crect x='11' y='12' width='3' height='6' fill='%23060607'/%3E%3Crect x='18' y='12' width='3' height='6' fill='%23060607'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Telefon / tablet engeli -->
  <div id="mobileBlock" class="mobile-block" hidden>
    <div class="mb-mark"><i></i><i></i></div>
    <h1>ZERO TRUST</h1>
    <p class="mb-main" data-i18n="mobile.title"></p>
    <p class="mb-sub" data-i18n="mobile.sub"></p>
  </div>

  <div id="app">
    <div id="stage" class="in-menu">
      <canvas id="game" width="1920" height="1080"></canvas>
      <div id="flash"></div>
      <div class="scanlines"></div>

      <!-- Oyun içi HUD -->
      <div id="hud">
        <div class="hud-l">
          <span class="hud-num" id="hudNum">01</span>
          <span class="hud-title" id="hudTitle"></span>
        </div>
        <div class="hud-r">
          <span class="tag" id="hudRadar" data-i18n="hud.radar" hidden></span>
          <div class="hud-stat">
            <span class="hud-time" id="hudTime">0:00.0</span>
            <small><span data-i18n="hud.best"></span> <b id="hudBest">–</b></small>
          </div>
          <div class="hud-stat deaths">
            <span class="hud-x"><i></i><b id="hudLDeaths">0</b></span>
            <small><b id="hudDeaths">0</b> <span data-i18n="hud.total"></span></small>
          </div>
          <button type="button" class="key-btn" id="hudPause">ESC</button>
        </div>
        <div id="hint"><span class="hint-k" data-i18n="hud.hint"></span><span id="hintText"></span></div>
        <div class="hud-keys"><kbd>R</kbd><span data-i18n="hud.restart"></span></div>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite">
        <span id="toastMain"></span>
        <span id="toastSub"></span>
      </div>

      <div id="intro">
        <span id="introNum"></span>
        <span id="introTitle"></span>
        <span id="introCh"></span>
      </div>

      <!-- Ana menü -->
      <section class="screen" id="scr-menu">
        <header class="bar">
          <div class="mark"><i></i><span>ZT</span></div>
          <div class="seg">
            <button type="button" data-lang="tr">TR</button>
            <button type="button" data-lang="en">EN</button>
          </div>
        </header>

        <div class="menu-body">
          <h1 class="title">
            <span class="glitch" data-text="ZERO">ZERO</span>
            <span class="glitch outline" data-text="TRUST">TRUST</span>
          </h1>
          <p class="tagline"><span class="caret">›</span> <span data-i18n="tagline"></span></p>

          <nav class="menu-nav">
            <button type="button" class="mi primary" id="btnPlay" data-autofocus><span class="mi-k">01</span><span id="btnPlayLabel"></span><em class="mi-note" id="btnPlayNote"></em></button>
            <button type="button" class="mi" id="btnLevels"><span class="mi-k">02</span><span data-i18n="menu.levels"></span></button>
            <button type="button" class="mi" id="btnSettings"><span class="mi-k">03</span><span data-i18n="menu.settings"></span></button>
          </nav>
        </div>

        <div class="demo-tag"><i></i><span data-i18n="menu.demo"></span></div>

        <footer class="bar bottom">
          <div class="stats">
            <div class="stat wide">
              <small data-i18n="menu.progress"></small>
              <span><b id="menuProgress">0</b><em id="menuTotal">/24</em></span>
              <div class="meter"><i id="menuMeter"></i></div>
            </div>
            <div class="stat">
              <small data-i18n="menu.deaths"></small>
              <span><b id="menuDeaths" class="danger">0</b></span>
            </div>
            <div class="stat">
              <small data-i18n="menu.time"></small>
              <span><b id="menuTime">–</b></span>
            </div>
          </div>
          <span class="dim" data-i18n="controls.short"></span>
        </footer>
      </section>

      <!-- Bölüm seçimi -->
      <section class="screen panel" id="scr-levels">
        <header class="bar">
          <button type="button" class="back" data-back>← <span data-i18n="back"></span></button>
          <h2 data-i18n="levels.title"></h2>
          <span class="bar-spacer"></span>
        </header>
        <div class="lv">
          <nav class="ch-rail" id="chRail"></nav>
          <div class="lv-main">
            <div class="ch-hero" id="chHero">
              <div class="ch-hero-l"><small id="chHeroName"></small><h3 id="chHeroTitle"></h3><p id="chHeroDesc"></p></div>
              <div class="ch-hero-r"><b id="chHeroDone">0</b><em id="chHeroTotal">/8</em></div>
            </div>
            <div class="level-grid" id="levelGrid"></div>
            <p class="lv-keys" data-i18n="levels.hintKeys"></p>
          </div>
        </div>
      </section>

      <!-- Ayarlar -->
      <section class="screen panel" id="scr-settings">
        <header class="bar">
          <button type="button" class="back" data-back data-autofocus>← <span data-i18n="back"></span></button>
          <h2 data-i18n="settings.title"></h2>
          <span class="bar-spacer"></span>
        </header>
        <div class="settings">
          <div class="set-col">
            <h3 data-i18n="settings.av"></h3>
            <div class="row">
              <div class="row-l"><span data-i18n="settings.lang"></span></div>
              <div class="seg" id="setLang"><button type="button" data-v="tr">Türkçe</button><button type="button" data-v="en">English</button></div>
            </div>
            <div class="row">
              <div class="row-l"><span data-i18n="settings.sound"></span></div>
              <div class="seg" id="setSound"><button type="button" data-v="on" data-i18n="on"></button><button type="button" data-v="off" data-i18n="off"></button></div>
            </div>
            <div class="row">
              <div class="row-l"><span data-i18n="settings.music"></span></div>
              <div class="seg" id="setMusic"><button type="button" data-v="on" data-i18n="on"></button><button type="button" data-v="off" data-i18n="off"></button></div>
            </div>
            <div class="row">
              <div class="row-l"><span data-i18n="settings.fullscreen"></span><small data-i18n="settings.fullscreenDesc"></small></div>
              <div class="seg" id="setFull"><button type="button" data-v="on" data-i18n="on"></button><button type="button" data-v="off" data-i18n="off"></button></div>
            </div>

            <h3 data-i18n="settings.game"></h3>
            <div class="row">
              <div class="row-l"><span data-i18n="settings.radar"></span><small data-i18n="settings.radarDesc"></small></div>
              <div class="seg" id="setRadar"><button type="button" data-v="on" data-i18n="on"></button><button type="button" data-v="off" data-i18n="off"></button></div>
            </div>

            <h3 data-i18n="settings.data"></h3>
            <div class="row">
              <div class="row-l"><span data-i18n="settings.reset"></span><small data-i18n="settings.resetDesc"></small></div>
              <button type="button" class="btn-danger" id="btnReset"></button>
            </div>
          </div>

          <aside class="set-col side">
            <h3 data-i18n="settings.controls"></h3>
            <div class="controls">
              <div><span class="keys"><kbd>A</kbd><kbd>D</kbd><em>/</em><kbd>←</kbd><kbd>→</kbd></span><span data-i18n="ctl.move"></span></div>
              <div><span class="keys"><kbd>W</kbd><em>/</em><kbd class="wide">Space</kbd></span><span data-i18n="ctl.jump"></span></div>
              <div><span class="keys"><kbd>R</kbd></span><span data-i18n="ctl.restart"></span></div>
              <div><span class="keys"><kbd class="wide">Esc</kbd></span><span data-i18n="ctl.pause"></span></div>
              <div><span class="keys"><kbd>F</kbd></span><span data-i18n="ctl.fullscreen"></span></div>
            </div>
          </aside>
        </div>
      </section>

      <!-- Duraklatma -->
      <section class="screen" id="scr-pause">
        <div class="card">
          <div class="card-main">
            <h2 data-i18n="pause.title"></h2>
            <nav class="menu-nav compact">
              <button type="button" class="mi primary" id="btnResume" data-autofocus><span class="mi-k">↵</span><span data-i18n="pause.resume"></span></button>
              <button type="button" class="mi" id="btnRestart"><span class="mi-k">R</span><span data-i18n="pause.restart"></span></button>
              <button type="button" class="mi" id="btnPauseLevels"><span class="mi-k">—</span><span data-i18n="pause.levels"></span></button>
              <button type="button" class="mi" id="btnPauseSettings"><span class="mi-k">—</span><span data-i18n="pause.settings"></span></button>
              <button type="button" class="mi" id="btnPauseMenu"><span class="mi-k">—</span><span data-i18n="pause.menu"></span></button>
            </nav>
          </div>
          <aside class="card-side">
            <span class="card-num" id="pauseNum">01</span>
            <span class="card-title" id="pauseTitle"></span>
            <dl class="facts">
              <div><dt data-i18n="stat.time"></dt><dd id="pauseTime">–</dd></div>
              <div><dt data-i18n="stat.best"></dt><dd id="pauseBest">–</dd></div>
              <div><dt data-i18n="stat.levelDeaths"></dt><dd id="pauseDeaths" class="danger">0</dd></div>
            </dl>
          </aside>
        </div>
      </section>

      <!-- Bitiş -->
      <section class="screen" id="scr-end">
        <div class="end">
          <span class="kicker" data-i18n="end.kicker"></span>
          <h2 data-i18n="end.title"></h2>
          <dl class="facts row-facts">
            <div><dt data-i18n="stat.cleared"></dt><dd id="endCleared">–</dd></div>
            <div><dt data-i18n="menu.time"></dt><dd id="endTime">–</dd></div>
            <div><dt data-i18n="menu.deaths"></dt><dd id="endDeaths" class="danger">0</dd></div>
            <div><dt data-i18n="stat.worst"></dt><dd id="endWorst">–</dd></div>
          </dl>
          <button type="button" class="mi primary" id="btnEndMenu" data-autofocus><span class="mi-k">↵</span><span data-i18n="end.menu"></span></button>
        </div>
      </section>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
